<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Authorization</title>
</head>
<body class="container">
<ul class="list-group">
    <li class="list-group-item">
        Пользователь: {{ user }}
    </li>
    <li class="list-group-item">
        Ваш инвайт-код: {{ request.user.invite_code }}
    </li>
    <li class="list-group-item">Вы зарегистрировались по инвайт-коду от: {{ user.invited_by.phone_number }}</li>
    <li class="list-group-item">
        <a href="{% url 'home' %}"> На главную </a>
    </li>
</ul>

{% block content %}
{% endblock %}
</body>
</html>
